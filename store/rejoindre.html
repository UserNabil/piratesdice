  ============================================================================
  LA PAGE DE REBOND DES INVITATIONS.

  A DEPOSER SUR LE SITE, a cote de privacy.html :
      usernabil.github.io/piratesdice-site/rejoindre.html

  Le jeu partage un lien de la forme
      https://usernabil.github.io/piratesdice-site/rejoindre.html?code=7QPGA

  ⛔ POURQUOI PASSER PAR UNE PAGE WEB PLUTOT QUE DE PARTAGER `piratesdice://`
  DIRECTEMENT. Les messageries ne rendent cliquable qu'un lien web : un lien a
  schema maison colle dans une conversation reste du texte mort chez la plupart
  d'entre elles. L'ami verrait une ligne bizarre et devrait la recopier a la
  main — exactement ce qu'on voulait lui epargner.

  ⚠️ ET LE REBOND N'EST PAS AUTOMATIQUE AU CHARGEMENT. iOS et Android bloquent
  l'ouverture d'une autre application tant que l'utilisateur n'a rien touche :
  une redirection posee dans `onload` ne part pas, et laisse une page qui a
  l'air cassee. On tente le rebond, et on montre TOUJOURS le bouton — c'est lui
  qui porte le geste de l'utilisateur, et c'est le seul chemin fiable.

  ⚠️ LE CODE EST ECRIT EN GROS, ET C'EST VOULU. Le lien peut echouer de dix
  facons — jeu pas installe, navigateur qui refuse le rebond, lien tronque. Le
  code, lui, se lit a voix haute et se tape dans « Jouer avec un ami ».
  ============================================================================
-->

<h1>Une table vous attend</h1>
<p>Ouvrez The Pirate's Dice pour rejoindre la partie.</p>

<div class="code" id="code">—</div>

<a class="bouton" id="ouvrir" href="#">Ouvrir le jeu</a>

<p class="discret">Le jeu n'est pas installé&nbsp;?</p>
<div class="rangee">
  <a class="boutique" href="https://apps.apple.com/app/id0000000000">App&nbsp;Store</a>
  <a class="boutique" href="https://play.google.com/store/apps/details?id=com.nabil.piratesdice">Google&nbsp;Play</a>
</div>

<p class="discret">Ou entrez le code dans «&nbsp;Jouer avec un ami&nbsp;».</p>

<script>
  var params = new URLSearchParams(location.search);
  var code = (params.get('code') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
  var vers = 'piratesdice://rejoindre?code=' + encodeURIComponent(code);

  if (code) {
    document.getElementById('code').textContent = code;
    document.getElementById('ouvrir').setAttribute('href', vers);
  } else {
    document.getElementById('code').textContent = '?????';
    document.getElementById('ouvrir').style.display = 'none';
  }

  /* La tentative automatique : elle passe quand le navigateur l'accepte, et ne
     casse rien quand il la refuse — le bouton reste, et c'est lui le vrai
     chemin. On attend un souffle pour que la page soit peinte d'abord : une
     redirection immediate laisse un ecran blanc si elle echoue. */
  if (code) setTimeout(function () { location.href = vers; }, 350);
</script>
