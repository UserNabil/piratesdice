# ============================================================================
# .github/workflows/play-scan.yml — REGARDER, sans jamais toucher.
#
# `play_api.py --check` demande a Play ce que le compte de service voit : les
# pistes et les numeros de version qui s'y trouvent. C'est la seule facon de
# verifier depuis l'exterieur qu'un envoi est bien arrive la ou on croit.
#
# ⛔ AUCUN ENVOI ICI. Cette chaine n'a qu'une commande, et elle est en lecture
# seule. Elle existe parce que la cle du compte de service vit dans les secrets
# du depot : personne n'a a la copier sur une machine pour poser une question.
# ============================================================================

name: Play scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ce que Play repond
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 play_api.py --check
