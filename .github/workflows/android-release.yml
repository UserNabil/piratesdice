# ============================================================================
# .github/workflows/android-release.yml — a poser dans le depot piratesdice.
#
# A CHAQUE POUSSEE SUR `main` : l'application est batie, signee, et envoyee sur
# la piste INTERNE du Play Store. Rien ne part en production tout seul — la
# promotion reste un geste humain dans la console (ou le workflow manuel plus
# bas, avec la piste en parametre).
#
# Le numero de version (versionCode) est le NUMERO DE LA COMPILATION : Play
# refuse deux envois avec le meme, et un numero choisi a la main finit toujours
# par etre oublie une fois.
# ============================================================================

name: Android release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'store/**']
  workflow_dispatch:
    inputs:
      track:
        description: "Piste Play (internal, alpha, beta, production)"
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Dependances
        run: npm ci

      # www/ est deja dans le depot (exporte depuis ee_admin), mais on le
      # reconstruit si l'adresse du serveur est fournie : c'est la seule chose
      # qui change entre un build de test et un build public.
      - name: Assembler le front
        if: ${{ vars.DICE_SERVER_URL != '' }}
        run: python3 build.py --server "${{ vars.DICE_SERVER_URL }}" --build "${{ github.run_number }}"

      - name: Verifier le front
        run: python3 build.py --check

      - name: Synchroniser Capacitor
        run: npx cap sync android

      # ── la signature : elle n'existe que le temps du build ────────────────
      - name: Poser la cle d'envoi
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::le secret ANDROID_KEYSTORE_BASE64 est absent" && exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Batir l'AAB signe
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Le numero de compilation devient le versionCode : jamais deux fois le meme.
          ORG_GRADLE_PROJECT_versionCode: ${{ github.run_number }}
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Effacer la cle
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Garder l'AAB en pièce jointe
        uses: actions/upload-artifact@v4
        with:
          name: piratesdice-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # ── l'envoi chez Google ───────────────────────────────────────────────
      - name: Envoyer sur Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.nabil.piratesdice
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
          whatsNewDirectory: store/whatsnew
