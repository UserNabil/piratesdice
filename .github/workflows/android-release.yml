# ============================================================================
# .github/workflows/android-release.yml — a poser dans le depot piratesdice.
#
# A CHAQUE POUSSEE SUR `main` : l'application est batie, signee, et envoyee sur
# la piste INTERNE du Play Store. Rien ne part en production tout seul — la
# promotion reste un geste humain dans la console (ou le workflow manuel plus
# bas, avec la piste en parametre).
#
# LE NUMERO DE VERSION EST DEMANDE A PLAY, PAS DEDUIT ICI.
#
# Il valait le numero de la compilation. C'etait faux des qu'un envoi partait a
# la main : deux compteurs pour une seule suite. Play refuse un versionCode deja
# pris, et il le refuse a la DERNIERE etape — apres un build complet et signe.
# Les compilations 1 a 31 etaient condamnees d'avance ; la 20 et la 21 sont
# mortes ainsi. Play est seul a savoir ce qui est pris : on le lui demande.
# ============================================================================

name: Android release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'store/**']
  workflow_dispatch:
    inputs:
      track:
        description: "Piste Play (internal, alpha, beta, production)"
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      forcer:
        description: "Pousser meme si la version precedente est encore en examen (elle sera effacee)"
        type: boolean
        default: false

# La chaine reecrit store/dernier-envoi.json : sans ce droit, la garde oublie
# a chaque run quelle version attend son examen.
permissions:
  contents: write

# ⚠️ MEME GROUPE QUE `play-listing.yml`, ET CE N EST PAS UN DETAIL.
# Play n accepte qu UNE edition a la fois : deux chaines qui lui parlent en
# meme temps se perime l une l autre en plein envoi. Le groupe commun les met
# a la queue leu leu.
concurrency:
  group: play
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Dependances
        run: npm ci

      - name: Outil d'envoi
        run: pip install --quiet cryptography

      # Le numero vient de Play, pas d'ici : voir l'en-tete de ce fichier.
      - name: Demander le prochain numero de version
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "VERSION_CODE=$(python3 play_api.py --next-version)" >> "$GITHUB_ENV"

      # www/ est deja dans le depot (exporte depuis ee_admin), mais on le
      # reconstruit si l'adresse du serveur est fournie : c'est la seule chose
      # qui change entre un build de test et un build public.
      - name: Assembler le front
        if: ${{ vars.DICE_SERVER_URL != '' }}
        run: python3 build.py --server "${{ vars.DICE_SERVER_URL }}" --build "$VERSION_CODE"

      - name: Verifier le front
        run: python3 build.py --check

      - name: Synchroniser Capacitor
        run: npx cap sync android

      # ── la signature : elle n'existe que le temps du build ────────────────
      - name: Poser la cle d'envoi
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::le secret ANDROID_KEYSTORE_BASE64 est absent" && exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Batir l'AAB signe
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Le numero de compilation devient le versionCode : jamais deux fois le meme.
          ORG_GRADLE_PROJECT_versionCode: ${{ env.VERSION_CODE }}
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Effacer la cle
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Garder l'AAB en pièce jointe
        uses: actions/upload-artifact@v5
        with:
          name: piratesdice-aab-${{ env.VERSION_CODE }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # ── l'envoi chez Google ───────────────────────────────────────────────
      # Le MEME outil qu'a la main. Une action tierce aurait sa propre idee de
      # ce qu'est un envoi reussi ; celle-ci sait deja retomber sur un depot
      # sans demande de revue quand un rejet est encore ouvert.
      - name: Envoyer sur Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PD_FORCER: ${{ inputs.forcer && '--forcer' || '' }}
          # push = on construit ; workflow_dispatch = on livre, et un
          # refus doit alors se voir en rouge.
          PD_SI_LIBRE: ${{ github.event_name == 'push' && '--si-libre' || '' }}
        run: |
          python3 play_api.py             --upload android/app/build/outputs/bundle/release/app-release.aab             --track "${{ inputs.track || 'internal' }}"             --notes-dir store/whatsnew $PD_FORCER $PD_SI_LIBRE

      # ⚠️ UNE GARDE QUI OUBLIE NE GARDE RIEN. `--upload` note la version poussee
      # dans store/dernier-envoi.json ; sur un runner, ce fichier meurt avec la
      # machine. Sans ce retour au depot, la chaine suivante ne saurait pas qu'une
      # version est en examen et l'effacerait — exactement ce qu'on repare ici.
      - name: Rapporter le journal d'envoi
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add store/dernier-envoi.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(play): version ${VERSION_CODE} poussee, examen en cours"
          # ⚠️ UN PUSH NU ECHOUE DES QUE QUELQU'UN A POUSSE PENDANT LA CHAINE, et
          # c'est arrive au premier essai : les notes de version parties entre
          # la construction et la fin ont fait passer la chaine au ROUGE alors
          # que la version 60 etait deja chez Play. Un envoi reussi ne doit pas
          # se solder par un echec pour une course de dix minutes.
          for essai in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "journal : le depot a bouge, nouvelle tentative ($essai/3)"
            sleep 5
          done
          # ⚠️ ET S'IL N'Y ARRIVE PAS, ON NE MEURT PAS POUR AUTANT. Le journal
          # est une garde, pas la livraison : la version est deja partie. On le
          # signale bien en vue, et l'on rend la main verte.
          echo "::warning::journal non rapporte : noter a la main la version ${VERSION_CODE} sur cette piste"

