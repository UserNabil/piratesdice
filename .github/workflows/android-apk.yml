# ============================================================================
# .github/workflows/android-apk.yml — UN APK SIGNE, A LA MAIN, POUR UN TESTEUR.
#
# Play n'est pas le seul chemin vers un appareil. Quand une version attend son
# examen — ou quand on veut simplement la faire essayer a quelqu'un — il faut un
# fichier qui s'installe, tout de suite, sans compte ni piste.
#
# ⚠️ CE N'EST PAS UN BUILD DE DEBUG. Un `assembleDebug` s'installe aussi, mais il
# porte `debuggable`, une signature de developpement et le nom « dev » : le
# testeur n'essaie alors pas ce que Play distribuera. Ici, meme cle d'envoi,
# meme configuration release, meme front que la production — seul le nom de
# version porte « -essai », pour qu'un rapport de bogue dise sur quoi il porte.
#
# ⛔ ET IL NE PARLE PAS A PLAY. Il lui demande le prochain numero (lecture
# seule) et s'arrete la : aucune edition ouverte, aucune piste touchee, donc
# rien a mettre a la queue derriere la chaine de publication.
# ============================================================================

name: APK a la main

on:
  workflow_dispatch:
    inputs:
      suffixe:
        description: "Suffixe du nom de version (visible par le testeur)"
        required: false
        default: "-essai"
        type: string

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Dependances
        run: npm ci

      - name: Outil de lecture Play
        run: pip install --quiet cryptography

      # Lecture seule : on veut un numero coherent avec la suite, pas le reserver.
      - name: Demander le prochain numero de version
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "VERSION_CODE=$(python3 play_api.py --next-version)" >> "$GITHUB_ENV"

      # ⚠️ L'ADRESSE DE PRODUCTION, COMME POUR UN VRAI ENVOI. Un APK de test qui
      # pointe ailleurs ne teste pas le jeu que les gens auront.
      - name: Assembler le front
        run: python3 build.py --server "${{ vars.DICE_SERVER_URL }}" --build "$VERSION_CODE"

      - name: Verifier le front
        run: python3 build.py --check

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Poser la cle d'envoi
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::le secret ANDROID_KEYSTORE_BASE64 est absent" && exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Batir l'APK signe
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_versionCode: ${{ env.VERSION_CODE }}
          ORG_GRADLE_PROJECT_versionSuffix: ${{ inputs.suffixe }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Effacer la cle
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      # ⚠️ ON VERIFIE CE QU'ON ENVOIE. Un APK non signe s'assemble sans broncher
      # et ne s'installe nulle part : le testeur decouvrirait le probleme a sa
      # place, une heure plus tard.
      - name: Verifier la signature
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          # ⛔ CETTE ETAPE PASSAIT AU VERT SANS RIEN VERIFIER, ET DEUX DEFAUTS
          # DIFFERENTS S'Y CACHAIENT.
          #
          #   "$ANDROID_HOME"/build-tools/*/apksigner verify … | head -4
          #
          # 1. LE JOKER TROUVE AUTANT DE CHEMINS QUE DE VERSIONS INSTALLEES. Le
          #    runner en a plusieurs : la ligne devenait « apksignerA apksignerB
          #    verify … », donc le second chemin passait pour un argument, et
          #    l'outil repondait « Unsupported command ». Vu dans le journal du
          #    build 75 — sans que personne ne le lise, puisque :
          # 2. LE TUBE REMPLACAIT LE CODE DE SORTIE PAR CELUI DE `head`. Quoi
          #    qu'il arrive en amont, l'etape reussissait.
          #
          # Le commentaire de cette etape promet pourtant « on verifie ce qu'on
          # envoie » : un APK non signe s'assemble sans broncher et ne s'installe
          # nulle part. La promesse etait fausse depuis le premier jour.
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "outil : $SIGNER"
          "$SIGNER" verify --print-certs "$APK"
          ls -lh "$APK"

      - name: Garder l'APK en piece jointe
        uses: actions/upload-artifact@v5
        with:
          name: piratesdice-apk-${{ env.VERSION_CODE }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
